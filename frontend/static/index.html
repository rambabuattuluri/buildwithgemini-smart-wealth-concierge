<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Wealth Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0f766e;
    --accent-dark: #042f2e;
    --accent-light: #ccfbf1;
    --bg: #f8fafc;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; color: #1e293b; }
  
  header { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); color:#fff; padding:1.1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.15); }
  .header-title { font-weight:700; font-size: 1.15rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem; }
  .header-subtitle { font-size: 0.8rem; opacity: 0.85; font-weight: 400; }
  
  #log { flex:1; overflow-y:auto; padding:1.5rem; max-width:820px; width:100%; margin:0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .msg { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.2s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  
  .sender-label { font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 0.25rem; padding: 0 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .msg.user .sender-label { color: #0f766e; }
  
  .bubble { display:inline-block; padding:.8rem 1.1rem; border-radius:16px; background:#fff; border:1px solid var(--border); text-align:left; white-space:pre-wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.03); line-height: 1.5; font-size: 0.95rem; }
  .msg.user .bubble { background: linear-gradient(135deg, #0f766e, #115e59); color:#fff; border:none; border-bottom-right-radius: 4px; box-shadow: 0 3px 10px rgba(15, 118, 110, 0.2); }
  .msg.agent .bubble { border-bottom-left-radius: 4px; border-left: 3px solid var(--accent); }
  
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow: none; }
  
  #quick-prompts { display:flex; gap:.6rem; padding:.75rem 1.25rem; background:#fff; border-top:1px solid var(--border); overflow-x:auto; }
  .prompt-chip { padding:.45rem .9rem; border:1px solid #cbd5e1; border-radius:20px; background:#f1f5f9; color:#334155; font-size:.85rem; font-weight:500; cursor:pointer; white-space:nowrap; transition:all 0.18s ease; display: inline-flex; align-items: center; gap: 0.3rem; }
  .prompt-chip:hover { background:var(--accent); color:#fff; border-color:var(--accent); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25); }
  
  form { display:flex; gap:.75rem; padding:1rem 1.25rem; border-top:1px solid var(--border); background:#fff; }
  input { flex:1; padding:.75rem 1rem; border:1px solid var(--border); border-radius:24px; font-size:.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15); }
  button { padding:.75rem 1.4rem; border:none; border-radius:24px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition: background 0.2s, transform 0.1s; }
  button:hover { background: #115e59; transform: translateY(-1px); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:16px; padding:1.2rem; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.05); max-width:100%; border-top: 3px solid var(--accent); }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
  
  /* Animated Pulse Typing Indicator */
  .typing-dots { display: inline-flex; align-items: center; gap: 5px; padding: 4px 6px; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent); animation: pulseDot 1.4s infinite ease-in-out both; }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulseDot { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; } 40% { transform: scale(1.1); opacity: 1; } }
</style>
</head>
<body>
<header>
  <div class="header-title">💼 Smart Wealth Concierge</div>
  <div class="header-subtitle">AI Financial & Investment Assistant</div>
</header>
<div id="log"></div>
<div id="quick-prompts">
  <button type="button" class="prompt-chip" data-prompt="Check stock quote for AAPL and calculate 5-year growth at 8%">📈 Stock Quote & Growth</button>
  <button type="button" class="prompt-chip" data-prompt="Find financial advisory branches near Wall Street, New York">📍 Nearby Advisors</button>
  <button type="button" class="prompt-chip" data-prompt="Generate a goal milestone graphic for $50,000 savings">🎨 Milestone Graphic</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask something about investments, expenses, or market news…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const senderLabel = el("div", "sender-label", who === "user" ? "You" : "Smart Wealth Concierge");
  const b = el("div", "bubble");
  m.appendChild(senderLabel);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  const typingDots = el("div", "typing-dots");
  typingDots.appendChild(el("span", "typing-dot"));
  typingDots.appendChild(el("span", "typing-dot"));
  typingDots.appendChild(el("span", "typing-dot"));
  b.appendChild(typingDots);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".prompt-chip").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-prompt");
    form.dispatchEvent(new Event("submit"));
  });
});
</script>
</body>
</html>
